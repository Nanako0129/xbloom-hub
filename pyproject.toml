[project]
name = "xbloom-hub"
version = "0.1.0"
description = "Self-hosted hub for the xBloom Studio coffee machine"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    # Exact pins: the write gate depends on how these pick their client class
    # (docs/S0-RESULTS.md, item 6). Re-check that before changing any of them.
    "xbloom-py[ble]==0.5.0",
    "bleak-esphome==4.1.0",
    "aioesphomeapi==46.30.0",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "pyyaml>=6",
    "mcp==2.3.0",
    # The community hub's one outbound client (docs/PLAN.md, S3b): the HTTP
    # library the mcp SDK already installs, named here because the hub uses it.
    "httpx2==2.16.0",
]

[project.scripts]
xbloom-hub = "xbloom_hub.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pytest-playwright==0.7.1",
]

[tool.uv]
# cryptography has no wheel aioesphomeapi accepts on Intel macOS, so a
# universal lock cannot resolve. Lock for where the hub runs.
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# The built dashboard is git-ignored but shipped: in the sdist and the wheel
# (docs/PLAN.md, S3c). Build it first with frontend/npm.sh run build.
artifacts = ["src/xbloom_hub/web/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Browser tests start a browser; run them with -m browser (tests/browser/conftest.py).
markers = ["browser: needs a browser and starts a simulator hub"]
addopts = "-m 'not browser'"
